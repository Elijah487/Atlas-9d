<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarefas — Atlas</title>
<style>

  /* ============ RESET & TOKENS (idênticos ao dashboard) ============ */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0e14;
    --surface: #10151d;
    --surface-2: #161c26;
    --line: #232a36;

    --blue: #2563eb;
    --blue-bright: #4f8dff;
    --blue-dim: #1d3a6e;

    --ink: #eef1f6;
    --ink-dim: #97a1b0;
    --ink-faint: #5e6675;

    --green: #3fb96f;
    --orange: #e0a23a;

    --radius: 10px;
    --radius-sm: 7px;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Arial, sans-serif;
    line-height: 1.5;
    font-size: 15px;
  }

  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  ul { list-style: none; }
  input { font-family: inherit; }

  ::selection { background: var(--blue); color: #fff; }
  :focus-visible { outline: 2px solid var(--blue-bright); outline-offset: 2px; }

  .fast { transition: background-color 0.15s, border-color 0.15s, color 0.15s; }

  /* ============ APP SHELL ============ */
  .app {
    display: grid;
    grid-template-columns: 232px 1fr;
    grid-template-rows: 60px 1fr;
    grid-template-areas:
      "header header"
      "sidebar main";
    min-height: 100vh;
  }

  /* ============ HEADER (idêntico ao dashboard) ============ */
  header {
    grid-area: header;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 0 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }

  .brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .brand-mark {
    width: 26px; height: 26px;
    border-radius: 7px;
    background: var(--blue);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 13px;
    color: #fff;
    flex-shrink: 0;
  }
  .brand-word { font-size: 16px; font-weight: 600; }

  .search-wrap {
    flex: 1;
    max-width: 420px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 8px 12px;
  }
  .search-wrap svg { width: 16px; height: 16px; color: var(--ink-faint); flex-shrink: 0; }
  .search-wrap input {
    flex: 1;
    background: none;
    border: none;
    color: var(--ink);
    font-size: 14px;
    outline: none;
  }
  .search-wrap input::placeholder { color: var(--ink-faint); }

  .header-right {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
  }
  .class-badge {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 7px 12px;
    border-radius: var(--radius-sm);
    background: var(--surface-2);
    border: 1px solid var(--line);
    font-size: 13px;
    color: var(--ink-dim);
  }
  .class-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }

  .logout-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    border-radius: var(--radius-sm);
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--ink-dim);
    font-size: 13px;
    font-weight: 600;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s;
  }
  .logout-btn:hover { background: #2a1414; border-color: #5c2222; color: #ff9a9a; }
  .logout-btn svg { width: 15px; height: 15px; flex-shrink: 0; }
  @media (max-width: 460px) { .logout-btn span { display: none; } }

  /* ============ SIDEBAR (idêntico ao dashboard) ============ */
  .sidebar {
    grid-area: sidebar;
    background: var(--surface);
    border-right: 1px solid var(--line);
    padding: 18px 12px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    font-size: 14px;
    color: var(--ink-dim);
  }
  .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
  .nav-item:hover { background: var(--surface-2); color: var(--ink); }
  .nav-item.active {
    background: var(--blue-dim);
    color: var(--blue-bright);
    font-weight: 600;
  }

  .sidebar-divider {
    height: 1px;
    background: var(--line);
    margin: 14px 4px;
  }

  /* ============ MAIN ============ */
  main {
    grid-area: main;
    padding: 24px 28px 48px;
    overflow-x: hidden;
  }

  .page-title { font-size: 21px; font-weight: 700; letter-spacing: -0.01em; }
  .page-sub { font-size: 14px; color: var(--ink-dim); margin-top: 4px; }

  section { margin-top: 24px; }

  /* ============ MOBILE TOPBAR TOGGLE ============ */
  .menu-btn {
    display: none;
    width: 36px; height: 36px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--line);
    background: var(--surface-2);
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .menu-btn svg { width: 17px; height: 17px; }

  @media (max-width: 1180px) {
    .app { grid-template-columns: 220px 1fr; }
  }

  @media (max-width: 720px) {
    .app { grid-template-columns: 1fr; grid-template-areas: "header" "main"; }
    .sidebar {
      position: fixed;
      top: 60px; left: 0; bottom: 0;
      width: 220px;
      transform: translateX(-100%);
      z-index: 50;
      transition: transform 0.18s ease;
    }
    .sidebar.open { transform: translateX(0); }
    .menu-btn { display: flex; }
    .search-wrap { display: none; }
    main { padding: 18px; }
  }

  @media (max-width: 460px) {
    .class-badge span:last-child { display: none; }
  }

  .empty-banner {
    text-align: center;
    padding: 48px 20px;
    color: var(--ink-faint);
    font-size: 14px;
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    margin-top: 16px;
    line-height: 1.6;
  }

  /* ============ GRID DE TAREFAS ============ */
  .tasks-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }

  .task-card {
    --sc: var(--blue-bright);
    --sc-dim: var(--blue-dim);

    position: relative;
    display: flex;
    flex-direction: column;

    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
    overflow: hidden;

    transition:
        transform .22s ease,
        border-color .22s ease,
        box-shadow .22s ease,
        background-color .22s ease;
  }

  .task-card-link {
    display: flex;
    flex-direction: column;
    gap: 10px;
    color: inherit;
    text-decoration: none;
  }

  .task-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(160deg, var(--sc) 0%, transparent 60%);
    opacity: 0;
    transition: opacity 0.25s ease;
    pointer-events: none;
  }
  .task-card:hover {
    transform: translateY(-3px);
    border-color: var(--sc);
    background: var(--surface-2);
    box-shadow: 0 14px 28px -14px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.02) inset;
  }
  .task-card:hover::before { opacity: 0.08; }
  .task-card:active { transform: translateY(-1px); }
  .task-card:focus-visible { outline: 2px solid var(--sc); outline-offset: 3px; }

  .task-card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;

    position: relative;
    z-index: 1;
  }
  .task-card-top-left {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    padding-right: 60px; /* Garante espaço para os botões absolutos no dev-mode */
  }
  .task-subject-badge {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.02em;
    padding: 3px 9px;
    border-radius: 100px;
    background: var(--sc-dim);
    color: var(--sc);
    flex-shrink: 0;
  }
  .task-due-badge {
    font-size: 11.5px;
    color: var(--ink-faint);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .task-due-badge.due-soon { color: var(--orange); font-weight: 600; }
  .task-due-badge svg { width: 12px; height: 12px; }

  .task-card-title {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.01em;
    position: relative;
    z-index: 1;
  }
  .task-card-excerpt {
    font-size: 13px;
    color: var(--ink-dim);
    line-height: 1.5;
    position: relative;
    z-index: 1;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .task-card-excerpt.is-empty { color: var(--ink-faint); font-style: italic; }

  /* Só existem no DOM quando dev (ver taskActionsHtml no JS). */
  .dev-only { display: none; }
  body.dev-mode-on .dev-only { display: inline-flex; }

  .task-card-actions {
    position: absolute;
    top: 14px;
    right: 14px;
    display: flex;
    gap: 6px;
    z-index: 20;
  }

  .icon-btn {
    width: 26px; height: 26px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-faint);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-btn svg { width: 13px; height: 13px; }
  .icon-btn:hover { color: var(--sc); border-color: var(--sc-dim); }
  .icon-btn.danger:hover { color: #ff7a7a; border-color: #5c2222; }
  .icon-btn.danger.confirming { background: #5c2222; color: #ffb4b4; border-color: #732a2a; }

  @media (max-width: 1180px) {
    .tasks-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 720px) {
    .tasks-grid { grid-template-columns: 1fr; }
  }

</style>

<script>
document.addEventListener('atlas-data-ready', function () {
  if (!window.AtlasData) return;

  // Mesmo mapa de cores usado em materias.html, para manter consistência visual.
  var SUBJECT_COLORS = {
    'Matemática':     { sc: '#ff3d50', dim: 'rgba(212,43,58,0.16)' },
    'Português':       { sc: '#ff3d50', dim: 'rgba(212,43,58,0.16)' },
    'História':        { sc: '#ff3d50', dim: 'rgba(212,43,58,0.16)' },
    'Geografia':       { sc: '#ff3d50', dim: 'rgba(212,43,58,0.16)' },
    'Ciências':        { sc: '#ff3d50', dim: 'rgba(212,43,58,0.16)' },
    'Inglês':          { sc: '#ff3d50', dim: 'rgba(212,43,58,0.16)' },
    'Arte':            { sc: '#ff3d50', dim: 'rgba(212,43,58,0.16)' },
    'O.E Matemática':  { sc: '#ff3d50', dim: 'rgba(212,43,58,0.16)' },
    'O.E Português':   { sc: '#ff3d50', dim: 'rgba(212,43,58,0.16)' },
    'Multidisciplinar':{ sc: '#ff3d50', dim: 'rgba(212,43,58,0.16)' }
  };
  var DEFAULT_COLOR = { sc: '#ff3d50', dim: 'rgba(212,43,58,0.16)' };

  function escapeHtml(str) {
    return String(str || '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function formatDateBR(isoDate) {
    if (!isoDate) return '';
    var parts = isoDate.split('-');
    if (parts.length !== 3) return isoDate;
    return parts[2] + '/' + parts[1] + '/' + parts[0];
  }

  function htmlToExcerpt(html, maxLen) {
    if (!html) return '';
    var tmp = document.createElement('div');
    tmp.innerHTML = html;
    var blockTags = ['P', 'H1', 'H2', 'H3', 'LI', 'BLOCKQUOTE', 'DIV', 'BR', 'HR'];
    Array.prototype.forEach.call(tmp.querySelectorAll(blockTags.join(',')), function (el) {
      el.insertAdjacentText('afterend', ' ');
    });
    var text = (tmp.textContent || tmp.innerText || '').replace(/\s+/g, ' ').trim();
    return text.length > maxLen ? text.slice(0, maxLen) + '…' : text;
  }

  function isDueSoon(isoDate) {
    if (!isoDate) return false;
    var due = new Date(isoDate + 'T00:00:00');
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    var diffDays = Math.round((due - today) / 86400000);
    return diffDays >= 0 && diffDays <= 3;
  }

  /* ---------------------------------------------------------
     Modo Desenvolvedor — trava REAL de permissão.
     taskActionsHtml só é chamada dentro do map() dos cards, e só
     retorna HTML não-vazio quando isDevSession() é true. Um aluno
     nunca recebe a marcação dos botões de editar/excluir no DOM.
  --------------------------------------------------------- */
  function isDevSession() { return AtlasData.isDev(); }
  if (isDevSession()) { document.body.classList.add('dev-mode-on'); }

  /* ---------------------------------------------------------
     Confirmação de exclusão sem popup: primeiro clique arma o
     botão (pede confirmação por 4s); segundo clique executa.
  --------------------------------------------------------- */
  function armConfirm(btn, onConfirm) {
    if (btn.dataset.armed === '1') {
      clearTimeout(Number(btn.dataset.timer));
      onConfirm();
      return;
    }
    btn.dataset.armed = '1';
    btn.classList.add('confirming');
    btn.setAttribute('aria-label', 'Confirmar exclusão');
    var t = setTimeout(function () {
      btn.dataset.armed = '0';
      btn.classList.remove('confirming');
      btn.setAttribute('aria-label', 'Excluir');
    }, 4000);
    btn.dataset.timer = String(t);
  }

  function taskActionsHtml(t) {
    if (!isDevSession()) return '';
    return (
      '<div class="task-card-actions dev-only">' +
        '<a class="icon-btn" data-action="edit-task" href="tarefa.html?id=' + encodeURIComponent(t.id) + '&editar=1&from=tarefas" aria-label="Editar">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>' +
        '</a>' +
        '<button type="button" class="icon-btn danger" data-action="delete-task" data-id="' + t.id + '" aria-label="Excluir">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>' +
        '</button>' +
      '</div>'
    );
  }

  var list = document.getElementById('allTasksList');
  var empty = document.getElementById('allTasksEmpty');

  function render() {
    var tasks = AtlasData.getTasks().slice().sort(function (a, b) {
      return (a.dataEntrega || '').localeCompare(b.dataEntrega || '');
    });

    empty.style.display = tasks.length ? 'none' : 'block';

    list.innerHTML = tasks.map(function (t) {
      var color = SUBJECT_COLORS[t.materia] || DEFAULT_COLOR;
      var excerpt = htmlToExcerpt(t.resposta, 110);
      var dueSoon = isDueSoon(t.dataEntrega);
      var excerptHtml = excerpt
        ? '<div class="task-card-excerpt">' + escapeHtml(excerpt) + '</div>'
        : '<div class="task-card-excerpt is-empty">Sem resposta/gabarito cadastrado ainda.</div>';

      return (
        '<div class="task-card" data-id="' + t.id + '" style="--sc:' + color.sc + '; --sc-dim:' + color.dim + ';">' +
          '<a class="task-card-link" href="tarefa.html?id=' + encodeURIComponent(t.id) + '&from=tarefas">' +
            '<div class="task-card-top">' +
              '<div class="task-card-top-left">' +
                '<span class="task-subject-badge">' + escapeHtml(t.materia) + '</span>' +
                '<span class="task-due-badge' + (dueSoon ? ' due-soon' : '') + '">' +
                  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>' +
                  escapeHtml(formatDateBR(t.dataEntrega)) +
                '</span>' +
              '</div>' +
            '</div>' +
            '<div class="task-card-title">' + escapeHtml(t.titulo) + '</div>' +
            excerptHtml +
          '</a>' +
          taskActionsHtml(t) +
        '</div>'
      );
    }).join('');
  }

  list.addEventListener('click', function (e) {
    var editLink = e.target.closest('[data-action="edit-task"]');
    var delBtn = e.target.closest('[data-action="delete-task"]');

    if (editLink) {
      e.stopPropagation();
      if (!isDevSession()) { e.preventDefault(); }
      return;
    }
    if (delBtn) {
      e.preventDefault();
      e.stopPropagation();
      if (!isDevSession()) return;
      armConfirm(delBtn, function () {
        AtlasData.deleteTask(delBtn.dataset.id);
        render();
      });
      return;
    }
  });

  render();
  AtlasData.onDataChange(render);
  AtlasData.injectDevBanner();
});

</script>

</body>
</html>
