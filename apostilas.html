<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apostilas (PDF) — Atlas</title>
<style>

  /* ============ RESET & TOKENS (idênticos ao dashboard) ============ */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0e14;
    --surface: #10151d;
    --surface-2: #161c26;
    --line: #232a36;

    --blue: #2563eb;
    --blue-bright: #4f8dff;
    --blue-dim: #1d3a6e;

    --ink: #eef1f6;
    --ink-dim: #97a1b0;
    --ink-faint: #5e6675;

    --green: #3fb96f;
    --orange: #e0a23a;

    --radius: 10px;
    --radius-sm: 7px;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Arial, sans-serif;
    line-height: 1.5;
    font-size: 15px;
  }

  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  ul { list-style: none; }
  input { font-family: inherit; }

  ::selection { background: var(--blue); color: #fff; }
  :focus-visible { outline: 2px solid var(--blue-bright); outline-offset: 2px; }

  .fast { transition: background-color 0.15s, border-color 0.15s, color 0.15s; }

  /* ============ APP SHELL ============ */
  .app {
    display: grid;
    grid-template-columns: 232px 1fr;
    grid-template-rows: 60px 1fr;
    grid-template-areas:
      "header header"
      "sidebar main";
    min-height: 100vh;
  }

  /* ============ HEADER (idêntico ao dashboard) ============ */
  header {
    grid-area: header;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 0 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }

  .brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .brand-mark {
    width: 26px; height: 26px;
    border-radius: 7px;
    background: var(--blue);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 13px;
    color: #fff;
    flex-shrink: 0;
  }
  .brand-word { font-size: 16px; font-weight: 600; }

  .search-wrap {
    flex: 1;
    max-width: 420px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 8px 12px;
  }
  .search-wrap svg { width: 16px; height: 16px; color: var(--ink-faint); flex-shrink: 0; }
  .search-wrap input {
    flex: 1;
    background: none;
    border: none;
    color: var(--ink);
    font-size: 14px;
    outline: none;
  }
  .search-wrap input::placeholder { color: var(--ink-faint); }

  .header-right {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
  }
  .class-badge {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 7px 12px;
    border-radius: var(--radius-sm);
    background: var(--surface-2);
    border: 1px solid var(--line);
    font-size: 13px;
    color: var(--ink-dim);
  }
  .class-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }

  .logout-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    border-radius: var(--radius-sm);
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--ink-dim);
    font-size: 13px;
    font-weight: 600;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s;
  }
  .logout-btn:hover { background: #2a1414; border-color: #5c2222; color: #ff9a9a; }
  .logout-btn svg { width: 15px; height: 15px; flex-shrink: 0; }
  @media (max-width: 460px) { .logout-btn span { display: none; } }

  /* ============ SIDEBAR (idêntico ao dashboard) ============ */
  .sidebar {
    grid-area: sidebar;
    background: var(--surface);
    border-right: 1px solid var(--line);
    padding: 18px 12px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    font-size: 14px;
    color: var(--ink-dim);
  }
  .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
  .nav-item:hover { background: var(--surface-2); color: var(--ink); }
  .nav-item.active {
    background: var(--blue-dim);
    color: var(--blue-bright);
    font-weight: 600;
  }

  .sidebar-divider {
    height: 1px;
    background: var(--line);
    margin: 14px 4px;
  }

  /* ============ MAIN ============ */
  main {
    grid-area: main;
    padding: 24px 28px 48px;
    overflow-x: hidden;
  }

  .page-title { font-size: 21px; font-weight: 700; letter-spacing: -0.01em; }
  .page-sub { font-size: 14px; color: var(--ink-dim); margin-top: 4px; }

  section { margin-top: 24px; }

  /* ============ BARRA DE FERRAMENTAS: busca + filtros ============ */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .subject-search {
    flex: 1;
    min-width: 220px;
    max-width: 380px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
  }
  .subject-search svg { width: 16px; height: 16px; color: var(--ink-faint); flex-shrink: 0; }
  .subject-search input {
    flex: 1;
    background: none;
    border: none;
    color: var(--ink);
    font-size: 14px;
    outline: none;
  }
  .subject-search input::placeholder { color: var(--ink-faint); }

  .filter-group {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .filter-chip {
    padding: 9px 16px;
    border-radius: 100px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-dim);
    font-size: 13.5px;
    font-weight: 500;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s;
  }
  .filter-chip:hover { color: var(--ink); border-color: var(--blue-dim); }
  .filter-chip.active {
    background: var(--blue-dim);
    border-color: var(--blue-dim);
    color: var(--blue-bright);
    font-weight: 600;
  }

  .results-empty {
    display: none;
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-faint);
    font-size: 14px;
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    margin-top: 24px;
  }
  .results-empty.show { display: block; }

  /* ============ GRID DE MATÉRIAS ============ */
  .subject-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-top: 18px;
  }

  .subject-card {
    --sc: var(--blue-bright);
    --sc-dim: var(--blue-dim);
    position: relative;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    cursor: pointer;
    overflow: hidden;
    transition: transform 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease, background-color 0.22s ease;
  }
  .subject-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(160deg, var(--sc) 0%, transparent 60%);
    opacity: 0;
    transition: opacity 0.25s ease;
    pointer-events: none;
  }
  .subject-card:hover {
    transform: translateY(-3px);
    border-color: var(--sc);
    background: var(--surface-2);
    box-shadow: 0 14px 28px -14px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.02) inset;
  }
  .subject-card:hover::before { opacity: 0.10; }
  .subject-card:active { transform: translateY(-1px); }
  .subject-card:focus-visible { outline: 2px solid var(--sc); outline-offset: 3px; }

  .subject-card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    position: relative;
    z-index: 1;
  }

  .subject-card-icon {
    width: 46px; height: 46px;
    border-radius: 11px;
    background: var(--sc-dim);
    color: var(--sc);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: transform 0.25s ease;
  }
  .subject-card:hover .subject-card-icon { transform: scale(1.06); }
  .subject-card-icon svg { width: 22px; height: 22px; }

  .subject-card-arrow {
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 1px solid var(--line);
    color: var(--ink-faint);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    opacity: 0;
    transform: translateX(-4px);
    transition: opacity 0.22s ease, transform 0.22s ease, color 0.22s ease, border-color 0.22s ease;
  }
  .subject-card-arrow svg { width: 14px; height: 14px; }
  .subject-card:hover .subject-card-arrow {
    opacity: 1;
    transform: translateX(0);
    color: var(--sc);
    border-color: var(--sc);
  }

  .subject-card-name {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.01em;
    position: relative;
    z-index: 1;
  }

  .subject-card-meta {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    position: relative;
    z-index: 1;
  }
  .meta-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    color: var(--ink-faint);
  }
  .meta-item svg { width: 13px; height: 13px; flex-shrink: 0; color: var(--ink-faint); }
  .meta-item strong { color: var(--ink-dim); font-weight: 600; }

  .subject-card-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    position: relative;
    z-index: 1;
  }
  .tag-pill {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.02em;
    padding: 3px 9px;
    border-radius: 100px;
    background: var(--sc-dim);
    color: var(--sc);
  }

  .subject-card.hidden { display: none; }

  /* ============ RESPONSIVE ============ */
  @media (max-width: 1180px) {
    .app { grid-template-columns: 220px 1fr; }
    .subject-grid { grid-template-columns: repeat(3, 1fr); }
  }

  @media (max-width: 860px) {
    .subject-grid { grid-template-columns: repeat(2, 1fr); }
  }

  /* ============ MOBILE TOPBAR TOGGLE ============ */
  .menu-btn {
    display: none;
    width: 36px; height: 36px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--line);
    background: var(--surface-2);
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .menu-btn svg { width: 17px; height: 17px; }

  @media (max-width: 720px) {
    .app { grid-template-columns: 1fr; grid-template-areas: "header" "main"; }
    .sidebar {
      position: fixed;
      top: 60px; left: 0; bottom: 0;
      width: 220px;
      transform: translateX(-100%);
      z-index: 50;
      transition: transform 0.18s ease;
    }
    .sidebar.open { transform: translateX(0); }
    .menu-btn { display: flex; }
    .search-wrap { display: none; }
    main { padding: 18px; }
    .toolbar { flex-direction: column; align-items: stretch; }
    .subject-search { max-width: none; }
    .filter-group { gap: 8px; }
    .subject-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
  }

  @media (max-width: 460px) {
    .subject-grid { grid-template-columns: 1fr; }
    .class-badge span:last-child { display: none; }
  }


  .btn-open-drive {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 12px 20px;
    border-radius: var(--radius-sm);
    background: var(--blue);
    color: #fff;
    font-size: 14.5px;
    font-weight: 600;
  }
  .btn-open-drive:hover { background: var(--blue-bright); }
  .btn-open-drive svg { width: 17px; height: 17px; flex-shrink: 0; }
  .btn-open-drive .ext-icon { width: 14px; height: 14px; opacity: 0.85; }
  .drive-hint { font-size: 12.5px; color: var(--ink-faint); margin-top: 8px; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="atlas-theme.css">
</head>
<body>

<!-- Camada central de dados e sessão, carregada como módulo ES. -->
<script type="module" src="atlas-data.js"></script>
<script>
  document.addEventListener('atlas-data-ready', function () {
    if (window.AtlasData) { AtlasData.requireSession('index.html'); }
  });
</script>

<div class="app">

  <header>
    <button class="menu-btn" id="menuBtn" aria-label="Abrir menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>

    <div class="brand">
      <div class="brand-mark">A</div>
      <span class="brand-word">Atlas</span>
    </div>

    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" placeholder="Pesquisar matérias, tarefas, apostilas...">
    </div>

    <div class="header-right">
      <div class="class-badge">
        <span class="dot"></span>
        <span>Turma:</span>
        <span><strong>9º D</strong></span>
      </div>
      <button class="logout-btn" id="logoutBtn" type="button" title="Sair">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        <span>Sair</span>
      </button>
    </div>
  </header>

  <nav class="sidebar" id="sidebar">
    <a class="nav-item fast" href="dashboard.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
      Dashboard
    </a>
    <a class="nav-item fast" href="materias.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      Matérias
    </a>
    <a class="nav-item active fast" href="apostilas.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/></svg>
      Apostilas (PDF)
    </a>
    <a class="nav-item fast" href="tarefas.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 11 3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      Tarefas
    </a>
    <a class="nav-item fast" href="calendario.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      Calendário
    </a>

    <div class="sidebar-divider"></div>
  </nav>

  <!-- ============ MAIN ============ -->
  <main>
    <h1 class="page-title">Apostilas (PDF)</h1>
    <p class="page-sub">Todo o material de aula da turma, organizado no Google Drive.</p>

    <section>
      <a class="btn-open-drive" id="openApostilasBtn" href="https://drive.google.com/drive/folders/1IYG6zG2tCBD2_TaMlyr2kHEUif6NhgS_?usp=drive_link" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
        Abrir Apostilas
        <svg class="ext-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M7 7h10v10"/></svg>
      </a>
      <p class="drive-hint">Abre a pasta de apostilas da turma no Google Drive, em uma nova aba.</p>
    </section>
  </main>

</div>

<script>
  // Mobile sidebar toggle — mesmo padrão do dashboard
  var menuBtn = document.getElementById('menuBtn');
  var logoutBtn = document.getElementById('logoutBtn');
  if (logoutBtn) {
    logoutBtn.addEventListener('click', function () {
      if (window.AtlasData) {
        AtlasData.logout();
      } else {
        window.location.href = 'index.html';
      }
    });
  }
  var sidebar = document.getElementById('sidebar');
  if (menuBtn) {
    menuBtn.addEventListener('click', function () {
      sidebar.classList.toggle('open');
    });
  }
  document.addEventListener('click', function (e) {
    if (sidebar.classList.contains('open') && !sidebar.contains(e.target) && e.target !== menuBtn && !menuBtn.contains(e.target)) {
      sidebar.classList.remove('open');
    }
  });

  document.addEventListener('atlas-data-ready', function () {
    if (window.AtlasData) { AtlasData.injectDevBanner(); }
  });
</script>

</body>
</html>
