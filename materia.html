<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matéria — Atlas</title>
<link rel="stylesheet" href="atlas-theme.css">
<style>
  /* ============ RESET & TOKENS ============ */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0e14;
    --surface: #10151d;
    --surface-2: #161c26;
    --line: #232a36;

    --blue: #2563eb;
    --blue-bright: #4f8dff;
    --blue-dim: #1d3a6e;

    --ink: #eef1f6;
    --ink-dim: #97a1b0;
    --ink-faint: #5e6675;

    --green: #3fb96f;
    --orange: #e0a23a;

    --radius: 10px;
    --radius-sm: 7px;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Arial, sans-serif;
    line-height: 1.5;
    font-size: 15px;
  }

  a { color: inherit; text-decoration: none; }

  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }

  .nav-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 16px;
  }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--ink-dim);
    font-size: 14px;
    font-weight: 500;
    transition: color 0.15s;
    cursor: pointer;
  }
  .back-btn:hover { color: var(--ink); }

  .nav-menu {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .nav-link {
    color: var(--ink-dim);
    font-size: 14px;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: var(--radius-sm);
    transition: all 0.15s ease;
    border: 1px solid transparent;
  }
  .nav-link:hover {
    color: var(--ink);
    background: var(--surface-2);
    border-color: var(--line);
  }
  .nav-link.active {
    color: var(--blue-bright);
    background: var(--blue-dim);
    border-color: var(--blue);
  }

  .page-title {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 20px;
  }

  .bimestre-tabs {
    display: flex;
    gap: 8px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 12px;
    margin-bottom: 24px;
    overflow-x: auto;
  }

  .tab-btn {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink-dim);
    padding: 8px 16px;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .tab-btn:hover {
    color: var(--ink);
    border-color: var(--ink-faint);
  }
  .tab-btn.active {
    background: var(--blue-dim);
    border-color: var(--blue);
    color: var(--blue-bright);
  }

  .materia-grid {
    display: flex;
    flex-direction: column;
    gap: 24px;
    width: 100%;
  }

  .section-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
    display: flex;
    flex-direction: column;
    width: 100%;
  }

  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }

  .section-head h2 {
    font-size: 18px;
    font-weight: 600;
    color: var(--ink);
  }

  .btn-add {
    background: var(--blue);
    color: #fff;
    border: none;
    padding: 8px 14px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-add:hover { background: var(--blue-bright); }

  .notes-grid, .tasks-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
    width: 100%;
  }

  .note-card, .task-card {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 16px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 12px;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.15s;
  }

  .note-card:hover, .task-card:hover {
    transform: translateY(-2px);
    border-color: var(--blue-bright);
  }

  .card-header-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .card-title {
    font-weight: 600;
    font-size: 15px;
    color: var(--ink);
  }

  .card-snippet {
    font-size: 13px;
    color: var(--ink-dim);
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: var(--ink-faint);
    border-top: 1px solid var(--line);
    padding-top: 10px;
    margin-top: 4px;
  }

  .empty-banner {
    text-align: center;
    padding: 32px 16px;
    color: var(--ink-dim);
    font-size: 14px;
    background: var(--surface-2);
    border: 1px dashed var(--line);
    border-radius: var(--radius-sm);
    width: 100%;
  }

  .card-actions {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .btn-icon-action {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink-dim);
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
    text-decoration: none;
  }
  .btn-icon-action:hover {
    color: var(--ink);
    border-color: var(--ink-faint);
    background: var(--surface);
  }
  .btn-icon-action.danger:hover {
    color: #ff5555;
    border-color: #ff5555;
  }

  .dev-only { display: none !important; }
  body.atlas-dev-active .dev-only { display: inline-flex !important; }
</style>
</head>
<body>

  <div class="container">
    <header class="nav-header">
      <a href="materias.html" class="back-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Voltar para Matérias
      </a>

      <nav class="nav-menu">
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="materias.html" class="nav-link active">Matérias</a>
        <a href="apostilas.html" class="nav-link">Apostilas</a>
        <a href="tarefas.html" class="nav-link">Tarefas</a>
        <a href="calendario.html" class="nav-link">Calendário</a>
      </nav>
    </header>

    <h1 class="page-title" id="materiaTitle">Matéria</h1>

    <div class="bimestre-tabs" id="bimestreTabs"></div>

    <div class="materia-grid">
      <div class="section-card">
        <div class="section-head">
          <h2>Anotações do Bimestre</h2>
          <button class="btn-add dev-only" id="addNoteBtn" type="button">+ Nova anotação</button>
        </div>
        <div class="notes-grid" id="notesGrid"></div>
        <div class="empty-banner" id="notesEmpty" style="display:none;">Nenhuma anotação cadastrada neste bimestre ainda.</div>
      </div>

      <div class="section-card">
        <div class="section-head">
          <h2>Tarefas do Bimestre</h2>
          <button class="btn-add dev-only" id="addTaskBtn" type="button">+ Nova tarefa</button>
        </div>
        <div class="tasks-grid" id="tasksList"></div>
        <div class="empty-banner" id="tasksEmpty" style="display:none;">Nenhuma tarefa cadastrada neste bimestre ainda.</div>
      </div>
    </div>
  </div>

  <script src="atlas-data.js"></script>
  <script>
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    var urlParams = new URLSearchParams(window.location.search);
    var materiaSlug = urlParams.get('materia') || '';
    
    var materiaObj = (AtlasData.SUBJECTS || []).find(function(s) {
      return AtlasData.slugify(s.name) === materiaSlug || s.name.toLowerCase() === materiaSlug.toLowerCase();
    });

    var materiaName = materiaObj ? materiaObj.name : (materiaSlug ? materiaSlug.charAt(0).toUpperCase() + materiaSlug.slice(1) : 'Matéria');
    document.getElementById('materiaTitle').textContent = materiaName;

    var currentBimestre = '1º Bimestre';

    function isDevSession() {
      return typeof AtlasData !== 'undefined' && AtlasData.isDev && AtlasData.isDev();
    }

    function armConfirm(btn, onConfirm) {
      if (btn.dataset.confirming === 'true') {
        onConfirm();
      } else {
        btn.dataset.confirming = 'true';
        var origText = btn.textContent;
        btn.textContent = 'Confirmar?';
        btn.style.borderColor = '#ff5555';
        btn.style.color = '#ff5555';
        setTimeout(function () {
          btn.dataset.confirming = 'false';
          btn.textContent = origText;
          btn.style.borderColor = '';
          btn.style.color = '';
        }, 3000);
      }
    }

    function renderTabs() {
      var container = document.getElementById('bimestreTabs');
      if (!container) return;
      var bimestres = AtlasData.BIMESTRES || ['1º Bimestre', '2º Bimestre', '3º Bimestre', '4º Bimestre'];

      container.innerHTML = bimestres.map(function(b) {
        var activeClass = (b === currentBimestre) ? ' active' : '';
        return '<button class="tab-btn' + activeClass + '" data-bimestre="' + escapeHtml(b) + '">' + escapeHtml(b) + '</button>';
      }).join('');

      container.querySelectorAll('.tab-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          currentBimestre = this.dataset.bimestre;
          renderTabs();
          renderNotes();
          renderTasks();
        });
      });
    }

    function noteActionsHtml(n) {
      return (
        '<div class="card-actions dev-only">' +
          '<a href="anotacao.html?id=' + encodeURIComponent(n.id) + '&editar=1" class="btn-icon-action" data-action="edit-note" title="Editar">Editar</a>' +
          '<button type="button" class="btn-icon-action danger" data-action="delete-note" data-id="' + escapeHtml(n.id) + '" title="Excluir">Excluir</button>' +
        '</div>'
      );
    }

    function taskActionsHtml(t) {
      return (
        '<div class="card-actions dev-only">' +
          '<a href="tarefa.html?id=' + encodeURIComponent(t.id) + '&editar=1" class="btn-icon-action" data-action="edit-task" title="Editar">Editar</a>' +
          '<button type="button" class="btn-icon-action danger" data-action="delete-task" data-id="' + escapeHtml(t.id) + '" title="Excluir">Excluir</button>' +
        '</div>'
      );
    }

    function renderNotes() {
      var notesGrid = document.getElementById('notesGrid');
      var notesEmpty = document.getElementById('notesEmpty');
      var notes = ((AtlasData.getNotesBy ? AtlasData.getNotesBy(materiaName, currentBimestre) : []) || []).slice();

      notes.sort(function (a, b) {
        var dateA = a.atualizadoEm || a.criadoEm || a.id || '';
        var dateB = b.atualizadoEm || b.criadoEm || b.id || '';
        return dateB.localeCompare(dateA);
      });

      if (notesEmpty) notesEmpty.style.display = notes.length ? 'none' : 'block';

      if (notesGrid) {
        notesGrid.style.display = notes.length ? 'grid' : 'none';
        notesGrid.innerHTML = notes.map(function (n) {
          var cleanSnippet = (n.conteudo || '').replace(/<[^>]*>/g, '').trim();
          return (
            '<div class="note-card" data-href="anotacao.html?id=' + encodeURIComponent(n.id) + '">' +
              '<div>' +
                '<div class="card-header-actions">' +
                  '<div class="card-title">' + escapeHtml(n.titulo || 'Sem título') + '</div>' +
                  noteActionsHtml(n) +
                '</div>' +
                '<div class="card-snippet">' + escapeHtml(cleanSnippet || 'Sem conteúdo adicional...') + '</div>' +
              '</div>' +
              '<div class="card-footer">' +
                '<span>' + escapeHtml(n.bimestre || currentBimestre) + '</span>' +
                '<span>Ver anotação &rarr;</span>' +
              '</div>' +
            '</div>'
          );
        }).join('');
      }
    }

    function renderTasks() {
      var tasksList = document.getElementById('tasksList');
      var tasksEmpty = document.getElementById('tasksEmpty');
      var tasks = ((AtlasData.getTasksBy ? AtlasData.getTasksBy(materiaName, currentBimestre) : []) || []).slice();

      tasks.sort(function (a, b) {
        var dateA = a.dataEntrega || a.id || '';
        var dateB = b.dataEntrega || b.id || '';
        return dateA.localeCompare(dateB);
      });

      if (tasksEmpty) tasksEmpty.style.display = tasks.length ? 'none' : 'block';

      if (tasksList) {
        tasksList.style.display = tasks.length ? 'grid' : 'none';
        tasksList.innerHTML = tasks.map(function (t) {
          var cleanSnippet = (t.resposta || '').replace(/<[^>]*>/g, '').trim();
          return (
            '<div class="task-card" data-href="tarefa.html?id=' + encodeURIComponent(t.id) + '">' +
              '<div>' +
                '<div class="card-header-actions">' +
                  '<div class="card-title">' + escapeHtml(t.titulo || 'Sem título') + '</div>' +
                  taskActionsHtml(t) +
                '</div>' +
                '<div class="card-snippet">' + escapeHtml(cleanSnippet || 'Sem resposta cadastrada...') + '</div>' +
              '</div>' +
              '<div class="card-footer">' +
                '<span>Data: ' + escapeHtml(t.dataEntrega || 'Sem data') + '</span>' +
                '<span>Ver tarefa &rarr;</span>' +
              '</div>' +
            '</div>'
          );
        }).join('');
      }
    }

    var notesGridEl = document.getElementById('notesGrid');
    if (notesGridEl) {
      notesGridEl.addEventListener('click', function (e) {
        var editBtn = e.target.closest('[data-action="edit-note"]');
        var delBtn = e.target.closest('[data-action="delete-note"]');

        if (editBtn) {
          e.stopPropagation();
          return; // Permite que a tag <a> de edição funcione
        }

        if (delBtn) {
          e.preventDefault();
          e.stopPropagation();
          if (!isDevSession()) return;
          armConfirm(delBtn, function () {
            AtlasData.deleteNote(delBtn.dataset.id);
            renderNotes();
          });
          return;
        }

        var card = e.target.closest('.note-card');
        if (card && card.dataset.href) {
          window.location.href = card.dataset.href;
        }
      });
    }

    var tasksListEl = document.getElementById('tasksList');
    if (tasksListEl) {
      tasksListEl.addEventListener('click', function (e) {
        var editBtn = e.target.closest('[data-action="edit-task"]');
        var delBtn = e.target.closest('[data-action="delete-task"]');

        if (editBtn) {
          e.stopPropagation();
          return; // Permite que a tag <a> de edição funcione
        }

        if (delBtn) {
          e.preventDefault();
          e.stopPropagation();
          if (!isDevSession()) return;
          armConfirm(delBtn, function () {
            AtlasData.deleteTask(delBtn.dataset.id);
            renderTasks();
          });
          return;
        }

        var card = e.target.closest('.task-card');
        if (card && card.dataset.href) {
          window.location.href = card.dataset.href;
        }
      });
    }

    var addNoteBtn = document.getElementById('addNoteBtn');
    if (addNoteBtn) {
      addNoteBtn.addEventListener('click', function () {
        if (!isDevSession()) return;
        window.location.href = 'anotacao.html?nova=1&materia=' + encodeURIComponent(AtlasData.slugify(materiaName)) + '&bimestre=' + encodeURIComponent(currentBimestre);
      });
    }

    var addTaskBtn = document.getElementById('addTaskBtn');
    if (addTaskBtn) {
      addTaskBtn.addEventListener('click', function () {
        if (!isDevSession()) return;
        window.location.href = 'tarefa.html?nova=1&materia=' + encodeURIComponent(AtlasData.slugify(materiaName)) + '&bimestre=' + encodeURIComponent(currentBimestre);
      });
    }

    renderTabs();
    renderNotes();
    renderTasks();

    if (typeof AtlasData !== 'undefined' && typeof AtlasData.onDataChange === 'function') {
      AtlasData.onDataChange(function () {
        renderNotes();
        renderTasks();
      });
    }

    if (typeof AtlasData !== 'undefined' && typeof AtlasData.injectDevBanner === 'function') {
      AtlasData.injectDevBanner();
    }
  </script>
</body>
</html>
