<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matéria — Atlas</title>
<style>

  /* ============ RESET & TOKENS ============ */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0e14;
    --surface: #10151d;
    --surface-2: #161c26;
    --line: #232a36;

    --blue: #2563eb;
    --blue-bright: #4f8dff;
    --blue-dim: #1d3a6e;

    --ink: #eef1f6;
    --ink-dim: #97a1b0;
    --ink-faint: #5e6675;

    --green: #3fb96f;
    --orange: #e0a23a;

    --radius: 10px;
    --radius-sm: 7px;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Arial, sans-serif;
    line-height: 1.5;
    font-size: 15px;
  }

  a { color: inherit; text-decoration: none; }

  /* ============ LAYOUT & HEADER ============ */
  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }

  .nav-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--ink-dim);
    font-size: 14px;
    font-weight: 500;
    transition: color 0.15s;
  }
  .back-btn:hover { color: var(--ink); }

  .page-title {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 20px;
  }

  /* ============ ABAS DE BIMESTRE ============ */
  .bimestre-tabs {
    display: flex;
    gap: 8px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 12px;
    margin-bottom: 24px;
    overflow-x: auto;
  }

  .tab-btn {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink-dim);
    padding: 8px 16px;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .tab-btn:hover {
    color: var(--ink);
    border-color: var(--ink-faint);
  }

  .tab-btn.active {
    background: var(--blue-dim);
    border-color: var(--blue);
    color: var(--blue-bright);
  }

  /* ============ BOTÕES / ABAS DE CONTEÚDO (ANOTAÇÕES E TAREFAS) ============ */
  .content-type-switch {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }

  .content-tab-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--ink-dim);
    padding: 12px 20px;
    border-radius: var(--radius);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .content-tab-btn:hover {
    background: var(--surface-2);
    color: var(--ink);
  }

  .content-tab-btn.active {
    background: var(--surface-2);
    border-color: var(--blue);
    color: var(--blue-bright);
    box-shadow: 0 0 12px rgba(37, 99, 235, 0.15);
  }

  /* ============ PAINÉIS DE CONTEÚDO ============ */
  .content-panel {
    display: none;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
  }

  .content-panel.active {
    display: block;
  }

  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }

  .section-head h2 {
    font-size: 18px;
    font-weight: 600;
    color: var(--ink);
  }

  .btn-add {
    background: var(--blue);
    color: #fff;
    border: none;
    padding: 8px 14px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-add:hover { background: var(--blue-bright); }

  /* ============ GRIDS & CARDS ============ */
  .notes-grid, .tasks-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }

  .note-card, .task-card {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 16px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 12px;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.15s;
  }

  .note-card:hover, .task-card:hover {
    transform: translateY(-2px);
    border-color: var(--blue-bright);
  }

  .card-title {
    font-weight: 600;
    font-size: 15px;
    color: var(--ink);
    margin-bottom: 6px;
  }

  .card-snippet {
    font-size: 13px;
    color: var(--ink-dim);
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: var(--ink-faint);
    border-top: 1px solid var(--line);
    padding-top: 10px;
    margin-top: 4px;
  }

  .empty-banner {
    text-align: center;
    padding: 36px 16px;
    color: var(--ink-dim);
    font-size: 14px;
    background: var(--surface-2);
    border: 1px dashed var(--line);
    border-radius: var(--radius-sm);
  }

  .dev-only { display: none; }
  body.atlas-dev-active .dev-only { display: inline-flex; }

</style>
</head>
<body>

  <div class="container">
    <header class="nav-header">
      <a href="materias.html" class="back-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Voltar para Matérias
      </a>
    </header>

    <h1 class="page-title" id="materiaTitle">Matéria</h1>

    <div class="bimestre-tabs" id="bimestreTabs"></div>

    <div class="content-type-switch">
      <button type="button" class="content-tab-btn active" id="btnTabNotes" onclick="switchContentTab('notes')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        Anotações
      </button>
      <button type="button" class="content-tab-btn" id="btnTabTasks" onclick="switchContentTab('tasks')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        Tarefas
      </button>
    </div>

    <div class="content-panel active" id="panelNotes">
      <div class="section-head">
        <h2>Anotações do Bimestre</h2>
        <button class="btn-add dev-only" id="addNoteBtn" type="button">+ Nova anotação</button>
      </div>
      <div class="notes-grid" id="notesGrid"></div>
      <div class="empty-banner" id="notesEmpty" style="display:none;">Nenhuma anotação cadastrada neste bimestre ainda.</div>
    </div>

    <div class="content-panel" id="panelTasks">
      <div class="section-head">
        <h2>Tarefas do Bimestre</h2>
        <button class="btn-add dev-only" id="addTaskBtn" type="button">+ Nova tarefa</button>
      </div>
      <div class="tasks-grid" id="tasksList"></div>
      <div class="empty-banner" id="tasksEmpty" style="display:none;">Nenhuma tarefa cadastrada neste bimestre ainda.</div>
    </div>

  </div>

  <script src="atlas-data.js"></script>
  <script>
    var urlParams = new URLSearchParams(window.location.search);
    var materiaSlug = urlParams.get('materia') || '';
    
    var materiaObj = (AtlasData.SUBJECTS || []).find(function(s) {
      return AtlasData.slugify(s.name) === materiaSlug || s.name.toLowerCase() === materiaSlug.toLowerCase();
    });

    var materiaName = materiaObj ? materiaObj.name : (materiaSlug ? materiaSlug.charAt(0).toUpperCase() + materiaSlug.slice(1) : 'Matéria');
    document.getElementById('materiaTitle').textContent = materiaName;

    var currentBimestre = '1º Bimestre';

    function isDevSession() {
      return typeof AtlasData !== 'undefined' && AtlasData.isDev && AtlasData.isDev();
    }

    function renderTabs() {
      var container = document.getElementById('bimestreTabs');
      if (!container) return;
      var bimestres = AtlasData.BIMESTRES || ['1º Bimestre', '2º Bimestre', '3º Bimestre', '4º Bimestre'];

      container.innerHTML = bimestres.map(function(b) {
        var activeClass = (b === currentBimestre) ? ' active' : '';
        return '<button class="tab-btn' + activeClass + '" data-bimestre="' + b + '">' + b + '</button>';
      }).join('');

      container.querySelectorAll('.tab-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          currentBimestre = this.dataset.bimestre;
          renderTabs();
          renderNotes();
          renderTasks();
        });
      });
    }

    function switchContentTab(type) {
      var btnNotes = document.getElementById('btnTabNotes');
      var btnTasks = document.getElementById('btnTabTasks');
      var panelNotes = document.getElementById('panelNotes');
      var panelTasks = document.getElementById('panelTasks');

      if (type === 'notes') {
        btnNotes.classList.add('active');
        btnTasks.classList.remove('active');
        panelNotes.classList.add('active');
        panelTasks.classList.remove('active');
      } else {
        btnTasks.classList.add('active');
        btnNotes.classList.remove('active');
        panelTasks.classList.add('active');
        panelNotes.classList.remove('active');
      }
    }

    function renderNotes() {
      var notesGrid = document.getElementById('notesGrid');
      var notesEmpty = document.getElementById('notesEmpty');
      var notes = ((AtlasData.getNotesBy ? AtlasData.getNotesBy(materiaName, currentBimestre) : []) || []).slice();

      notes.sort(function (a, b) {
        var dateA = a.atualizadoEm || a.criadoEm || a.id || '';
        var dateB = b.atualizadoEm || b.criadoEm || b.id || '';
        return dateB.localeCompare(dateA);
      });

      if (notesEmpty) notesEmpty.style.display = notes.length ? 'none' : 'block';

      if (notesGrid) {
        notesGrid.innerHTML = notes.map(function (n) {
          var cleanSnippet = (n.conteudo || '').replace(/<[^>]*>/g, '').trim();
          return (
            '<div class="note-card" onclick="window.location.href=\'anotacao.html?id=' + encodeURIComponent(n.id) + '\'">' +
              '<div>' +
                '<div class="card-title">' + (n.titulo || 'Sem título') + '</div>' +
                '<div class="card-snippet">' + (cleanSnippet || 'Sem conteúdo adicional...') + '</div>' +
              '</div>' +
              '<div class="card-footer">' +
                '<span>' + (n.bimestre || currentBimestre) + '</span>' +
                '<span>Ver anotação &rarr;</span>' +
              '</div>' +
            '</div>'
          );
        }).join('');
      }
    }

    function renderTasks() {
      var tasksList = document.getElementById('tasksList');
      var tasksEmpty = document.getElementById('tasksEmpty');
      var tasks = ((AtlasData.getTasksBy ? AtlasData.getTasksBy(materiaName, currentBimestre) : []) || []).slice();

      tasks.sort(function (a, b) {
        var dateA = a.dataEntrega || a.id || '';
        var dateB = b.dataEntrega || b.id || '';
        return dateA.localeCompare(dateB);
      });

      if (tasksEmpty) tasksEmpty.style.display = tasks.length ? 'none' : 'block';

      if (tasksList) {
        tasksList.innerHTML = tasks.map(function (t) {
          var cleanSnippet = (t.resposta || '').replace(/<[^>]*>/g, '').trim();
          return (
            '<div class="task-card" onclick="window.location.href=\'tarefa.html?id=' + encodeURIComponent(t.id) + '\'">' +
              '<div>' +
                '<div class="card-title">' + (t.titulo || 'Sem título') + '</div>' +
                '<div class="card-snippet">' + (cleanSnippet || 'Sem resposta cadastrada...') + '</div>' +
              '</div>' +
              '<div class="card-footer">' +
                '<span>Data: ' + (t.dataEntrega || 'Sem data') + '</span>' +
                '<span>Ver tarefa &rarr;</span>' +
              '</div>' +
            '</div>'
          );
        }).join('');
      }
    }

    var addNoteBtn = document.getElementById('addNoteBtn');
    if (addNoteBtn) {
      addNoteBtn.addEventListener('click', function () {
        if (!isDevSession()) return;
        window.location.href = 'anotacao.html?nova=1&materia=' + encodeURIComponent(AtlasData.slugify(materiaName)) + '&bimestre=' + encodeURIComponent(currentBimestre);
      });
    }

    var addTaskBtn = document.getElementById('addTaskBtn');
    if (addTaskBtn) {
      addTaskBtn.addEventListener('click', function () {
        if (!isDevSession()) return;
        window.location.href = 'tarefa.html?nova=1&materia=' + encodeURIComponent(AtlasData.slugify(materiaName)) + '&bimestre=' + encodeURIComponent(currentBimestre);
      });
    }

    renderTabs();
    renderNotes();
    renderTasks();

    if (typeof AtlasData !== 'undefined' && typeof AtlasData.onDataChange === 'function') {
      AtlasData.onDataChange(function () {
        renderNotes();
        renderTasks();
      });
    }

    if (typeof AtlasData !== 'undefined' && typeof AtlasData.injectDevBanner === 'function') {
      AtlasData.injectDevBanner();
    }
  </script>
</body>
</html>
